identity:
  name: get_issue
  author: shaba
  label:
    en_US: Get issue
description:
  human:
    en_US: Get a single issue by number, including its comments
  llm: Get the details of a single issue in a Forgejo or Gitea repository by its number, including state, author, labels, body and the first comments.
parameters:
  - name: owner
    type: string
    required: true
    label:
      en_US: Owner
    human_description:
      en_US: Repository owner (user or organization)
    llm_description: The owner (user or organization) of the repository
    form: llm
  - name: repo
    type: string
    required: true
    label:
      en_US: Repository
    human_description:
      en_US: Repository name (without .git)
    llm_description: The repository name without the .git extension
    form: llm
  - name: index
    type: number
    required: true
    label:
      en_US: Issue number
    human_description:
      en_US: The issue number
    llm_description: The numeric issue index/number within the repository
    form: llm
extra:
  python:
    source: tools/get_issue.py
