identity:
  name: list_pulls
  author: shaba
  label:
    en_US: List pull requests
description:
  human:
    en_US: List pull requests in a repository, filtered by state
  llm: List pull requests in a Forgejo or Gitea repository. Filter by state (open, closed, all). Returns PR number, state, title and author.
parameters:
  - name: owner
    type: string
    required: true
    label:
      en_US: Owner
    human_description:
      en_US: Repository owner (user or organization)
    llm_description: The owner (user or organization) of the repository
    form: llm
  - name: repo
    type: string
    required: true
    label:
      en_US: Repository
    human_description:
      en_US: Repository name (without .git)
    llm_description: The repository name without the .git extension
    form: llm
  - name: state
    type: select
    required: false
    default: open
    options:
      - value: open
        label:
          en_US: Open
      - value: closed
        label:
          en_US: Closed
      - value: all
        label:
          en_US: All
    label:
      en_US: State
    human_description:
      en_US: Pull request state filter
    llm_description: Pull request state filter, one of open, closed or all. Defaults to open.
    form: llm
extra:
  python:
    source: tools/list_pulls.py
